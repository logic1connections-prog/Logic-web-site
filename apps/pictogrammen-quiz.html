  * { box-sizing: border-box; }
  body {

  .neon-cyan { color: #00E0FF; }
  .neon-pink { color: #FF2DAA; }
  .neon-yellow { color: #FFD400; }

  h2 { text-align: center; margin: 0 0 1rem; font-weight: normal; }

    border: 2px solid #7A00FF; border-radius: 8px;
    background: #fff;
  }
  .answer-btn {
    text-align: left; width: 100%; padding: 12px 16px; border-radius: 10px;
    font-family: 'Rajdhani','Segoe UI',sans-serif; font-weight: 600; font-size: 1rem;
    background: #131318; color: #E8E8F5; border: 2px solid #333; cursor: pointer;
    transition: all .15s ease; margin-bottom: 0.5rem; display: block;
  }
  .answer-btn:hover:not(:disabled) { border-color: #00E0FF; transform: translateX(4px); }
  .answer-btn.correct { background: rgba(57,255,136,0.18); border-color: #39FF88; color: #39FF88; }
  .answer-btn.wrong { background: rgba(255,45,170,0.18); border-color: #FF2DAA; color: #FF2DAA; }
  .answer-btn:disabled { cursor: not-allowed; }
  .feedback {
    margin-top: 1rem; padding: 1rem; border-radius: 8px; font-family: monospace; font-size: 0.95rem;
  }
  .feedback.correct { background: rgba(57,255,136,0.12); border: 1px solid #39FF88; color: #39FF88; }
  .feedback.wrong { background: rgba(255,45,170,0.12); border: 1px solid #FF2DAA; color: #FF2DAA; }
  .next-btn {
    margin-top: 1rem; width: 100%; padding: 0.75rem 1rem; font-family: 'Bangers',sans-serif;
    font-size: 1.25rem; border-radius: 8px; cursor: pointer;
    background: #131318; color: #00E0FF; border: 2px solid #00E0FF;
  }
  .next-btn:hover { filter: brightness(1.3); }
  .progress {
    font-family: monospace; font-size: 0.8rem; color: #aaa; text-align: center; margin-bottom: 0.5rem;
  }
  .summary { text-align: center; padding: 2rem 1rem; }
  .summary h2 { color: #FFD400; font-size: 2.5rem; }
  .intro-list { line-height: 1.7; }
  .legend {
    display: flex; justify-content: center; gap: 1rem; margin: 1rem 0; flex-wrap: wrap;
    font-family: monospace; font-size: 0.85rem;
  }
  .legend span { padding: 0.3rem 0.7rem; border-radius: 6px; }
  .l-gevaar { background: #FFD400; color: #000; }
  .l-verbod { background: #FF2DAA; color: #fff; }
  .l-gebod { background: #00E0FF; color: #000; }
  .l-redding { background: #39FF88; color: #000; }
  .l-brand { background: #D32F2F; color: #fff; }

    q: "Een pictogram is BLAUW met een witte afbeelding in een cirkel. Welke boodschap geeft dit?",
    opts: [
      "REDDING – volg deze route",
      "BRANDBESTRIJDING – hier staat een blusser",
      "GEBOD – je bent VERPLICHT dit te dragen of te doen"
    ],
    correct: 2,
    feedback_correct: "Juist! Blauw + witte cirkel = GEBOD (M-pictogrammen). Voorbeelden: veiligheidshelm verplicht, bril verplicht, handschoenen verplicht.",
    feedback_wrong: "Fout. Blauw + wit = GEBOD. Groen = redding, rood vierkant = brandbestrijding."
  }
];

let state = {{
  started: false,
  currentIndex: 0,
  answered: false,
  selectedIdx: null,
  correctCount: 0,
  wrongAnswers: []
}};

function renderIntro() {
  return `
    <div class="intro-list">
      <h1 class="comic-font neon-pink" style="font-size:2.5rem">PICTOGRAMMEN QUIZ</h1>
      <h2 class="neon-cyan">Les 1 — 3 meerkeuzevragen</h2>
      <div class="panel" style="margin: 1rem 0;">
        <p style="margin-top:0"><strong>Doel:</strong> je leert de drie hoofdcategorieën van veiligheidspictogrammen herkennen op basis van <strong>kleur</strong> en <strong>vorm</strong>.</p>
        <p>Dit zijn de officiële <strong>ISO 7010</strong>-categorieën:</p>
        <div class="legend">
          <span class="l-gevaar">▲ GEVAAR (geel, driehoek)</span>
          <span class="l-verbod">🚫 VERBOD (rood, cirkel+streep)</span>
          <span class="l-gebod">ⓘ GEBOD (blauw, cirkel)</span>
          <span class="l-redding">✓ REDDING (groen)</span>
          <span class="l-brand">🔥 BRAND (rood vierkant)</span>
        </div>
        <p>Klik op <strong>Start</strong> om te beginnen. Bij elk fout antwoord krijg je uitleg, en je kunt onderaan je fouten nalezen.</p>
      </div>
      <button class="next-btn" onclick="startQuiz()">▶ START QUIZ</button>
    </div>
  `;
}

function renderQuestion() {
  const q = QUESTIONS[state.currentIndex];
  return `
    <div class="progress">Vraag ${state.currentIndex + 1} van ${QUESTIONS.length}</div>
    <img src="data:image/jpeg;base64,${q.image}" class="question-image" alt="Pictogram"/>
    <div class="panel">
      <p style="font-size:1.05rem; margin-top:0">${q.q}</p>
      <div id="answerList">
        ${q.opts.map((opt, i) => `
          <button class="answer-btn" data-idx="${i}" ${state.answered ? 'disabled' : ''}>${String.fromCharCode(65 + i)}. ${opt}</button>
        `).join('')}
      </div>
      <div id="feedbackZone"></div>
    </div>
  `;
}

function renderSummary() {
  const ok = state.correctCount;
  const tot = QUESTIONS.length;
  const pct = Math.round(ok / tot * 100);
  return `
    <div class="summary">
      <h1 class="comic-font neon-pink" style="font-size:2.5rem">RESULTAAT</h1>
      <h2>${ok} / ${tot} juist (${pct}%)</h2>
      ${state.wrongAnswers.length === 0 ? '<p class="neon-cyan">Perfect! Je kent de pictogramcategorieën.</p>' : `
        <div class="panel" style="text-align:left; margin: 1rem 0;">
          <h3 class="neon-yellow" style="margin-top:0">Foutenoverzicht</h3>
          ${state.wrongAnswers.map((w, i) => `
            <div style="margin-bottom:1rem; padding-bottom:1rem; border-bottom: 1px solid #333;">
              <p><strong>Vraag:</strong> ${w.question}</p>
              <p><span style="color:#FF2DAA">Jouw antwoord: ${w.selected}</span></p>
              <p><span style="color:#39FF88">Juist: ${w.correct}</span></p>
              <p style="color:#aaa; font-size:0.9rem">${w.explanation}</p>
            </div>
          `).join('')}
        </div>
      `}
      <button class="next-btn" onclick="restart()">🔁 OPNIEUW</button>
    </div>
  `;
}

function render() {
  const app = document.getElementById('app');
  if (state.currentIndex >= QUESTIONS.length) {
    app.innerHTML = renderSummary();
  } else if (state.currentIndex === 0 && !state.started) {
    app.innerHTML = renderIntro();
  } else {
    app.innerHTML = renderQuestion();
    attachHandlers();
  }
}

function startQuiz() {
  state.started = true;
  state.currentIndex = 0;
  state.answered = false;
  state.selectedIdx = null;
  state.correctCount = 0;
  state.wrongAnswers = [];
  render();
}

function restart() {
  state.started = false;
  state.currentIndex = 0;
  state.answered = false;
  state.selectedIdx = null;
  state.correctCount = 0;
  state.wrongAnswers = [];
  render();
}

function attachHandlers() {
  document.querySelectorAll('.answer-btn').forEach(btn => {
    btn.addEventListener('click', () => handleAnswer(parseInt(btn.dataset.idx, 10)));
  });
}

function handleAnswer(idx) {
  if (state.answered) return;
  state.answered = true;
  state.selectedIdx = idx;
  const q = QUESTIONS[state.currentIndex];
  const correct = idx === q.correct;

  // Visueel markeren
  document.querySelectorAll('.answer-btn').forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.correct) btn.classList.add('correct');
    else if (i === idx) btn.classList.add('wrong');
  });

  if (correct) {
    state.correctCount += 1;
  } else {
    state.wrongAnswers.push({
      question: q.q,
      selected: q.opts[idx],
      correct: q.opts[q.correct],
      explanation: q.feedback_correct
    });
  }

  // Feedback
  const fz = document.getElementById('feedbackZone');
  fz.innerHTML = `
    <div class="feedback ${correct ? 'correct' : 'wrong'}">
      ${correct ? '✔ ' + q.feedback_correct : '✖ ' + q.feedback_wrong}
    </div>
    <button class="next-btn" onclick="nextQuestion()">
      ${state.currentIndex + 1 >= QUESTIONS.length ? '🏁 NAAR RESULTAAT' : 'VOLGENDE VRAAG ▶'}
    </button>
  `;
}

function nextQuestion() {
  state.currentIndex += 1;
  state.answered = false;
  state.selectedIdx = null;
  render();
}

render();
</script>
